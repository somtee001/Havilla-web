<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgotten Password | Havilla</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2 family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#f6f8fb] min-h-screen flex items-center justify-center p-4">
    <div
      class="bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-md p-8"
    >
      <a
        href="signin.html"
        class="inline-flex items-center gap-2 text-xs font-semibold text-[#072447] hover:underline mb-6"
      >
        <i class="fa-solid fa-arrow-left-long"></i> Back to login
      </a>

      <div class="flex justify-center mb-6">
        <img
          src="../assets/images/verification-success.png"
          alt="Recovery Graphic"
          class="w-40 h-auto object-contain"
        />
      </div>

      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-[#072447]">Forgotten Password</h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">
          Enter your email address and we'll send you an OTP code to securely
          reset your account password.
        </p>
      </div>

      <form id="forgotPasswordForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5"
            >Email Address</label
          >
          <div
            class="h-11 bg-white border border-gray-200 rounded-xl flex items-center px-4 gap-3 focus-within:border-[#072447] transition-all"
          >
            <i class="fa-regular fa-envelope text-gray-400 text-sm"></i>
            <input
              type="email"
              required
              placeholder="Enter your email address"
              class="w-full bg-transparent border-none outline-none text-sm text-gray-700"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full h-11 bg-[#072447] hover:bg-[#0d2d56] text-white rounded-xl text-sm font-semibold shadow-sm transition-colors duration-150"
        >
          Send Reset Code
        </button>
      </form>
    </div>

    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          // Appends the recovery flow flag to the URL string
          window.location.href = "verification.html?flow=recovery";
        });
    </script>
  </body>
</html>
