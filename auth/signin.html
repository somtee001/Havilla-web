<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Havilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signin.js" defer></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div
      class="flex w-full max-w-4xl min-h-[600px] bg-white rounded-2xl overflow-hidden shadow-lg"
    >
      <!-- LEFT: venue image -->
      <div class="hidden md:block w-2/5 relative">
        <img
          src="Images/Rectangle 112 (1).png"
          alt="Venue"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- RIGHT: form -->
      <div class="w-full md:w-3/5 px-10 py-10 flex flex-col justify-center">
        <!-- Mobile nav -->
        <nav class="md:hidden flex items-center justify-between py-2 mb-6">
          <div class="flex justify-center items-center gap-2">
            <img src="Images/Logo (2).png" alt="Logo" />
            <p class="text-[#0A243F] font-bold text-lg">Havilla.</p>
          </div>
          <button onclick="toggleMenu()" class="text-[#0A243F] text-2xl">
            ☰
          </button>
        </nav>

        <div
          id="mobileMenu"
          class="hidden flex-col gap-4 pb-4 text-sm bg-white mb-2"
        >
          <a class="text-[#0A243F] font-medium" href="#">Home</a>
          <a class="text-[#0A243F] opacity-50" href="#">How it works</a>
          <a class="text-[#0A243F] opacity-50" href="#">Features</a>
          <a class="text-[#0A243F]" href="signup.html">Sign Up</a>
        </div>

        <!-- Desktop logo -->
        <div class="hidden md:flex items-center gap-2 mb-6">
          <img src="Images/Logo (2).png" alt="Logo" class="w-8 h-8" />
        </div>

        <h2 class="text-2xl font-bold text-[#0A243F] mb-1" id="header">
          Sign into Your Account
        </h2>
        <p class="text-sm text-gray-500 mb-5" id="subtext">
          Welcome back. Sign in to continue planning smarter with Havilla.
        </p>

        <!-- Toggle -->
        <div
          class="flex rounded-lg overflow-hidden border border-gray-200 mb-5"
        >
          <button
            id="plannerBtn"
            onclick="switchRole('planner')"
            class="w-1/2 py-2 text-sm font-medium bg-[#0A243F] text-white transition-colors duration-200"
          >
            Planner
          </button>
          <button
            id="ownerBtn"
            onclick="switchRole('owner')"
            class="w-1/2 py-2 text-sm font-medium bg-white text-gray-500 transition-colors duration-200"
          >
            Venue Owner
          </button>
        </div>

        <!-- Planner Form -->
        <form id="plannerForm" method="POST" class="hidden">
          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerEmail"
              >Email Address</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="email"
                id="plannerEmail"
                placeholder="Enter email address"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs">›</span>
            </div>
          </div>

          <div class="mb-3">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerPassword"
              >Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                id="plannerPassword"
                placeholder="Enter password"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer"
                >👁</span
              >
            </div>
          </div>

          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
              <input
                type="checkbox"
                id="plannerRemember"
                class="w-4 h-4 accent-[#F4A160]"
              />
              <label for="plannerRemember" class="text-xs text-gray-500"
                >Keep me signed in</label
              >
            </div>
            <a
              href="forgot-password.html"
              class="text-xs text-[#E71616] opacity-80 font-medium"
              >Forgotten Password?</a
            >
          </div>

          <button
            type="submit"
            class="w-full bg-[#a8c4e0] text-white py-3 rounded-lg text-sm font-medium mb-4 hover:bg-[#F4A160] transition-colors duration-200"
          >
            Continue
          </button>

          <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xl text-gray-400">or</span>
            <div class="flex-1 h-px bg-gray-200"></div>
          </div>

          <div class="flex justify-center gap-4 mb-5">
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img
                src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271618/aquarius_pmlxdc.png"
                alt="Google"
                class="w-5 h-5"
              />
            </button>
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img
                src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/facebook.icon_vfzumx.png"
                alt="Facebook"
                class="w-5 h-5"
              />
            </button>
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img
                src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/Apple-icon_j6khdt.png"
                alt="Apple"
                class="w-5 h-5"
              />
            </button>
          </div>

          <p class="text-xs text-center text-gray-500">
            Don't have an account?
            <a href="signup.html" class="text-[#0A243F] font-medium">Sign Up</a>
          </p>
        </form>

        <!-- Owner Form -->
        <form id="ownerForm" method="POST" class="hidden">
          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerEmail"
              >Email Address</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="email"
                id="ownerEmail"
                placeholder="Enter email address"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs">›</span>
            </div>
          </div>

          <div class="mb-3">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerPassword"
              >Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                id="ownerPassword"
                placeholder="Enter password"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer"
                >👁</span
              >
            </div>
          </div>

          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
              <input
                type="checkbox"
                id="ownerRemember"
                class="w-4 h-4 accent-[#F4A160]"
              />
              <label for="ownerRemember" class="text-xs text-gray-500"
                >Keep me signed in</label
              >
            </div>
            <a
              href="forgot-password.html"
              class="text-xs text-[#F4A160] font-medium"
              >Forgot Password?</a
            >
          </div>

          <button
            type="submit"
            class="w-full bg-[#a8c4e0] text-white py-3 rounded-lg text-sm font-medium mb-4 hover:bg-[#F4A160] transition-colors duration-200"
          >
            Continue
          </button>

          <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xl text-gray-400">or</span>
            <div class="flex-1 h-px bg-gray-200"></div>
          </div>

          <div class="flex justify-center gap-4 mb-5">
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                alt="Google"
                class="w-5 h-5"
              />
            </button>
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img
                src="../Images/facebook.icon.png"
                alt="Facebook"
                class="w-5 h-5"
              />
            </button>
            <button
              type="button"
              class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50"
            >
              <img src="../Images/Apple-icon.png" alt="Apple" class="w-5 h-5" />
            </button>
          </div>

          <p class="text-xs text-center text-gray-500">
            Don't have an account?
            <a href="signup.html" class="text-[#0A243F] font-medium">Sign Up</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
