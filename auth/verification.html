<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Code | Havilla</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#f6f8fb] min-h-screen flex items-center justify-center p-4">
    <div
      class="bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-md p-8 relative"
    >
      <a
        id="backLink"
        href="#"
        class="inline-flex items-center gap-2 text-xs font-semibold text-[#072447] hover:underline mb-6"
      >
        <i class="fa-solid fa-arrow-left-long"></i> Back
      </a>

      <div class="flex justify-center mb-6">
        <img
          src="../assets/images/verification-success.png"
          alt="Security Graphic"
          class="w-40 h-auto object-contain"
        />
      </div>

      <div class="text-center mb-6">
        <h2 id="pageHeading" class="text-xl font-bold text-[#072447]">
          Verification Code
        </h2>
        <p class="text-xs text-gray-500 mt-2 leading-relaxed">
          An OTP has been sent to your email. Kindly enter the 6-digit
          verification code sent to your account inbox.
        </p>
      </div>

      <div class="flex justify-between gap-2 max-w-xs mx-auto mb-4">
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
        <input
          type="text"
          maxlength="1"
          class="w-11 h-11 text-center text-lg font-bold border border-gray-200 rounded-xl outline-none focus:border-[#072447] bg-gray-50/50 transition-all"
        />
      </div>

      <p class="text-xs text-center text-gray-400 mb-6 font-medium">
        Didn't get a code?
        <a href="#" class="text-[#072447] font-semibold hover:underline"
          >Click to resend</a
        >
        (<span id="countdown" class="font-bold text-gray-600">1:00</span>)
      </p>

      <button
        class="w-full h-11 bg-[#072447] hover:bg-[#0d2d56] text-white rounded-xl text-sm font-semibold shadow-sm transition-colors duration-150"
        onclick="openVerificationModal()"
      >
        Verify Code
      </button>
    </div>

    <div
      id="successModal"
      class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50"
    >
      <div
        class="bg-white rounded-2xl p-8 max-w-sm w-full border border-gray-100 shadow-xl text-center"
      >
        <div
          class="w-14 h-14 bg-emerald-50 text-emerald-500 border border-emerald-100 text-xl rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3 id="modalHeading" class="text-lg font-bold text-gray-800">
          Verified!
        </h3>
        <p
          id="modalText"
          class="text-xs text-gray-500 mt-1.5 leading-relaxed"
        ></p>
        <button
          onclick="redirectToNextStep()"
          id="modalBtn"
          class="w-full h-10 bg-[#072447] hover:bg-[#0d2d56] text-white rounded-xl text-xs font-semibold shadow-sm transition-colors mt-5"
        >
          Continue
        </button>
      </div>
    </div>

    <script>
      // Read URL flow parameter tag
      const urlParams = new URLSearchParams(window.location.search);
      const currentFlow = urlParams.get("flow") || "signup";

      // Adjust static layouts elements dynamically
      const pageHeading = document.getElementById("pageHeading");
      const backLink = document.getElementById("backLink");

      if (currentFlow === "signup") {
        pageHeading.textContent = "Verify Your Account";
        backLink.href = "signup.html";
      } else {
        pageHeading.textContent = "Forgotten Password";
        backLink.href = "forgot-password.html";
      }

      // Auto jump input helper controls logic loops
      const inputs = document.querySelectorAll('input[type="text"]');
      inputs.forEach((input, i) => {
        input.addEventListener("input", () => {
          if (input.value.length === 1 && i < inputs.length - 1)
            inputs[i + 1].focus();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && input.value === "" && i > 0)
            inputs[i - 1].focus();
        });
      });

      // Countdown Timer
      let seconds = 60;
      const countdown = document.getElementById("countdown");
      const timer = setInterval(() => {
        seconds--;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        countdown.textContent = `${m}:${s.toString().padStart(2, "0")}`;
        if (seconds <= 0) clearInterval(timer);
      }, 1000);

      // Modal triggers
      function openVerificationModal() {
        const modal = document.getElementById("successModal");
        const mHead = document.getElementById("modalHeading");
        const mText = document.getElementById("modalText");
        const mBtn = document.getElementById("modalBtn");

        if (currentFlow === "signup") {
          mHead.textContent = "Registration Verified!";
          mText.textContent =
            "Your account has been activated successfully. Let's finish setting up your environment.";
          mBtn.textContent = "Complete Signup";
        } else {
          mHead.textContent = "Identity Confirmed!";
          mText.textContent =
            "Your password recovery token has been approved. You can now finalize your change updates safely.";
          mBtn.textContent = "Update Password Profile";
        }
        modal.classList.remove("hidden");
      }

      function redirectToNextStep() {
        window.location.href = `success.html?flow=${currentFlow}`;
      }
    </script>
  </body>
</html>
