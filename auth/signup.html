<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Havilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="signup.js" defer></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div
      class="flex w-full max-w-4xl min-h-[600px] bg-white rounded-2xl overflow-hidden shadow-lg"
    >
      <div class="hidden md:block w-2/5">
        <img
          src="Images/Rectangle 112 (1).png"
          alt="Venue"
          class="w-full h-full object-cover"
        />
      </div>

      <div
        class="w-full md:w-3/5 px-4 md:px-10 py-10 flex flex-col justify-center"
      >
        <nav class="md:hidden flex items-center justify-between py-2 mb-6">
          <div class="flex justify-center items-center gap-2">
            <img src="Images/Logo (2).png" alt="Logo" />
            <p class="text-[#0A243F] font-bold text-lg">Havilla.</p>
          </div>
          <button
            id="menuBtn"
            onclick="toggleMenu()"
            class="md:hidden text-[#0A243F] text-2xl"
          >
            ☰
          </button>
        </nav>

        <div
          id="mobileMenu"
          class="hidden md:hidden flex-col gap-4 px-6 pb-4 text-sm bg-white"
        >
          <a class="text-[#0A243F] font-medium" href="#">Home</a>
          <a class="text-[#0A243F] opacity-50" href="#">How it works</a>
          <a class="text-[#0A243F] opacity-50" href="#">Features</a>
          <a class="text-[#0A243F]" href="signin.html">Sign in</a>
        </div>

        <div class="hidden md:flex items-center gap-2 mb-4">
          <img src="Images/Logo (2).png" alt="Logo" class="w-8 h-8" />
        </div>

        <h2 class="text-2xl font-bold text-[#0A243F] mb-1">
          Create an Account
        </h2>
        <p class="text-sm text-gray-500 mb-5" id="subtext">
          Join Havilla as an event planner and simplify venue discovery, booking
          coordination, and event management from one modern dashboard.
        </p>

        <div
          class="flex rounded-lg overflow-hidden border border-gray-200 mb-5"
        >
          <button
            id="plannerBtn"
            onclick="switchRole('planner')"
            class="w-1/2 py-2 text-sm font-medium bg-[#0A243F] text-white transition-colors duration-200"
          >
            Planner
          </button>
          <button
            id="ownerBtn"
            onclick="switchRole('owner')"
            class="w-1/2 py-2 text-sm font-medium bg-white text-gray-500 transition-colors duration-200"
          >
            Venue Owner
          </button>
        </div>

        <form id="plannerForm" method="POST" class="hidden">
          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerFullName"
              >Full Name</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="text"
                placeholder="Enter full name"
                id="plannerFullName"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs select-none">›</span>
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerEmail"
              >Email Address</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="email"
                placeholder="Enter email address"
                id="plannerEmail"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs select-none">›</span>
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerPassword"
              >Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                placeholder="Enter password"
                id="plannerPassword"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer select-none"
                >👁</span
              >
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="plannerConfirmPassword"
              >Confirm Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                placeholder="Enter password"
                id="plannerConfirmPassword"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer select-none"
                >👁</span
              >
            </div>
          </div>

          <div class="flex items-center gap-2 mb-5">
            <input
              type="checkbox"
              id="plannerTerms"
              class="w-4 h-4 accent-[#0A243F]"
            />
            <label for="plannerTerms" class="text-xs text-gray-500 select-none">
              I accept Havilla's
              <a href="#" class="text-[#114FF5] underline">Terms of Service</a>
              and
              <a href="#" class="text-[#114FF5] underline">Privacy Policy</a>
            </label>
          </div>

          <button
            type="submit"
            id="plannerSubmit"
            class="w-full bg-[#a8c4e0] text-white py-3 rounded-lg text-sm font-medium mb-4 transition-all duration-200 cursor-not-allowed"
            disabled
          >
            Continue
          </button>
        </form>

        <form id="ownerForm" method="POST" class="hidden">
          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerFullName"
              >Full Name</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="text"
                placeholder="Enter full name"
                id="ownerFullName"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs select-none">›</span>
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerEmail"
              >Email Address</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="email"
                placeholder="Enter email address"
                id="ownerEmail"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span class="text-gray-300 text-xs select-none">›</span>
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerPassword"
              >Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                placeholder="Enter password"
                id="ownerPassword"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer select-none"
                >👁</span
              >
            </div>
          </div>

          <div class="mb-4">
            <label
              class="block text-sm font-medium text-[#0A243F] mb-1"
              for="ownerConfirmPassword"
              >Confirm Password</label
            >
            <div
              class="flex items-center border border-gray-200 rounded-lg px-3 py-2"
            >
              <input
                type="password"
                placeholder="Enter password"
                id="ownerConfirmPassword"
                class="w-full text-sm outline-none text-gray-700 placeholder-gray-400"
              />
              <span
                onclick="togglePassword(this)"
                class="text-gray-400 text-sm cursor-pointer select-none"
                >👁</span
              >
            </div>
          </div>

          <div class="flex items-center gap-2 mb-5">
            <input
              type="checkbox"
              id="ownerTerms"
              class="w-4 h-4 accent-[#0A243F]"
            />
            <label for="ownerTerms" class="text-xs text-gray-500 select-none">
              I accept Havilla's
              <a href="#" class="text-[#114FF5] underline">Terms of Service</a>
              and
              <a href="#" class="text-[#114FF5] underline">Privacy Policy</a>
            </label>
          </div>

          <button
            type="submit"
            id="ownerSubmit"
            class="w-full bg-[#a8c4e0] text-white py-3 rounded-lg text-sm font-medium mb-4 transition-all duration-200 cursor-not-allowed"
            disabled
          >
            Continue
          </button>
        </form>

        <div class="flex items-center gap-3 mb-4">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xl text-gray-400">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <div class="flex justify-center gap-4 mb-5">
          <button
            type="button"
            class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50 rounded-lg"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271618/aquarius_pmlxdc.png"
              alt="Google"
              class="w-5 h-5"
            />
          </button>
          <button
            type="button"
            class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50 rounded-lg"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/facebook.icon_vfzumx.png"
              alt="Facebook"
              class="w-5 h-5"
            />
          </button>
          <button
            type="button"
            class="border border-gray-200 flex justify-center items-center md:w-64 w-28 h-10 hover:bg-gray-50 rounded-lg"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/Apple-icon_j6khdt.png"
              alt="Apple"
              class="w-5 h-5"
            />
          </button>
        </div>

        <p class="text-xs text-center text-gray-500">
          Already have an account?
          <a
            href="signin.html"
            class="text-[#0A243F] font-semibold underline hover:text-[#0A243F]/80"
            >Log In</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
