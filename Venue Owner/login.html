<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Havilla - Welcome Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 flex items-center justify-center min-h-screen p-4 md:p-0"
  >
    <div
      class="bg-white rounded-3xl overflow-hidden w-full max-w-[1000px] min-h-[620px] flex flex-col md:flex-row shadow-2xl"
    >
      <div
        class="md:w-1/2 relative bg-purple-900 min-h-[300px] md:min-h-auto overflow-hidden"
      >
        <img
          src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1780000277/Rectangle_112_ds0eng.png"
          alt="Elegant Event Table Setting"
          class="absolute inset-0 w-full h-full object-cover opacity-90 brightness-95 transform scale-105"
        />
        <div
          class="absolute inset-0 bg-gradient-to-tr from-purple-600/30 via-transparent to-pink-500/10 mix-blend-screen"
        ></div>
      </div>

      <div class="md:w-1/2 p-8 md:p-14 flex flex-col justify-center bg-white">
        <div class="mb-6">
          <div class="w-10 h-10 flex items-center justify-center">
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1780003003/Logo_mnqmhg.svg"
              alt="Havilla Logo"
              class="w-8 h-8 object-contain"
            />
          </div>
        </div>

        <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">
          Welcome Back!
        </h1>
        <p class="text-xs text-slate-400 leading-relaxed max-w-sm mb-8">
          Sign in to your internal workspace to manage bookings, respond to
          quote requests, list venue, and communicate with clients.
        </p>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label
              class="block text-[11px] font-semibold text-slate-700 mb-1.5"
              for="email"
              >Email Address</label
            >
            <div class="relative">
              <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required
                class="w-full h-11 px-4 pr-10 border border-slate-200 rounded-xl text-xs outline-none focus:border-sky-300 focus:ring-4 focus:ring-sky-500/5 transition-all placeholder:text-slate-300 text-slate-700"
              />
              <span class="absolute right-3.5 top-3.5 text-slate-300 text-xs">
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
              </span>
            </div>
          </div>

          <div>
            <label
              class="block text-[11px] font-semibold text-slate-700 mb-1.5"
              for="password"
              >Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
                class="w-full h-11 px-4 pr-10 border border-slate-200 rounded-xl text-xs outline-none focus:border-sky-300 focus:ring-4 focus:ring-sky-500/5 transition-all placeholder:text-slate-300 text-slate-700"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility()"
                class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 transition-colors"
              >
                <i id="passwordEyeIcon" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] pt-1">
            <label
              class="flex items-center gap-2 text-slate-500 font-medium cursor-pointer select-none"
            >
              <input
                type="checkbox"
                id="rememberMe"
                class="w-3.5 h-3.5 rounded border-slate-200 text-sky-400 focus:ring-sky-400 accent-sky-400 cursor-pointer"
              />
              Keep me signed in
            </label>
            <a href="#" class="text-rose-500 font-semibold hover:underline"
              >Forgot Password?</a
            >
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="w-full h-11 bg-[#bfe0ff] hover:bg-[#a6d2fc] active:bg-[#93c5f5] text-[#0052cc] font-semibold text-xs rounded-xl tracking-wide transition-all shadow-xs"
            >
              Continue
            </button>
          </div>
        </form>

        <div class="relative my-6 text-center">
          <hr class="border-slate-100" />
          <span
            class="absolute left-1/2 -top-2 -translate-x-1/2 bg-white px-3 text-[10px] text-slate-300 uppercase tracking-widest font-medium"
            >or</span
          >
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button
            type="button"
            class="h-10 border border-slate-100 hover:bg-slate-50 rounded-xl flex items-center justify-center transition-all cursor-pointer"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271618/aquarius_pmlxdc.png"
              alt="Google icon"
              class="w-4 h-4"
            />
          </button>
          <button
            type="button"
            class="h-10 border border-slate-100 hover:bg-slate-50 rounded-xl flex items-center justify-center transition-all cursor-pointer"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/facebook.icon_vfzumx.png"
              alt="Facebook icon"
              class="w-4 h-4"
            />
          </button>
          <button
            type="button"
            class="h-10 border border-slate-100 hover:bg-slate-50 rounded-xl flex items-center justify-center transition-all cursor-pointer"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1781271395/Apple-icon_j6khdt.png"
              alt="Apple icon"
              class="w-4.5 h-4.5 mb-0.5"
            />
          </button>
        </div>

        <div class="mt-8 text-center text-[11px] font-medium text-slate-400">
          Don't have an account?
          <a href="#" class="text-orange-500 hover:underline font-bold ml-0.5"
            >Log In</a
          >
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility field type securely
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("passwordEyeIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-regular", "fa-eye");
          eyeIcon.classList.add("fa-solid", "fa-eye-slash");
        } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-solid", "fa-eye-slash");
          eyeIcon.classList.add("fa-regular", "fa-eye");
        }
      }

      // Direct redirection execution routing seamlessly over to dashboard workspace context
      function handleLogin(e) {
        e.preventDefault();
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
